name: Обновление зависимостей

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Обновление зависимостей
        uses: Stivo182/depos-action@v2
        with:
          engine: auto
          token: ${{ secrets.PUSH_TOKEN }}
